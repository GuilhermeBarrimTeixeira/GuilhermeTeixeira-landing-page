name: Deploy para o Github Pages

on: 
  push:
    branches: [main]


permissions: 
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5
      
      - name: Preparar o Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      
      - name: Instalar as dependência
        run: npm ci 

      - name: Verificar o código
        run: npm run lint

      - name: Buildar para produção
        run: npm run build

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar e enviar o artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    enviroment:
      name: github-pages
      url: ${{ step.deployment.outputs.page_url }}
    steps:
      - name: Publicar no github pages
        id: deployment
        uses: actions/deploy-pages@v4